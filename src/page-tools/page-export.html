<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>导出当前内容</title>
  <link rel="stylesheet" href="page-tools.css">
</head>
<body class="export-page">
  <main id="export-panel">
    <header class="export-heading">
      <h1>导出内容</h1>
      <button id="close" class="export-close" type="button" aria-label="关闭导出面板" title="关闭（Esc）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
      </button>
    </header>
    <div class="export-fields">
      <label for="format">文件格式
        <select id="format"><option value="md">Markdown (.md)</option><option value="txt">TXT (.txt)</option><option value="html">HTML (.html)</option><option value="json">JSON (.json)</option><option value="csv">CSV (.csv)</option><option value="pdf">PDF (.pdf)</option></select>
      </label>
      <label for="scope">导出范围
        <select id="scope" aria-describedby="scope-hint"><option value="single">仅此条</option><option value="thread">作者线程</option></select>
      </label>
    </div>
    <p id="scope-hint" class="export-hint">仅当前帖子或评论，长文自动补全</p>
    <div class="export-actions">
      <button id="download" class="export-primary" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg><span data-label>下载文件</span>
      </button>
      <button id="copy" title="复制为当前选择的格式" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V4H4v11h4"/></svg><span>复制</span>
      </button>
    </div>
    <div id="status" class="export-status" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  </main>
  <script src="page-export.js"></script>
</body>
</html>
