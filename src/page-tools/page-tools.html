<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页面采集工具</title><link rel="stylesheet" href="page-tools.css"></head>
<body>
<h1>批量采集</h1>
<p id="source">正在识别当前页面…</p>
<div class="row"><button id="select">选择多条</button><button id="cancel-selection">退出选择</button></div>
<p>下载格式：HTML (.html)</p>
<label>采集范围 <select id="scope"><option value="loaded">本页已加载列表</option><option value="automatic">按设置自动翻页</option></select></label>
<p id="strategy"></p>
<button id="start" disabled>开始导出</button>
<div class="row"><button id="reset-queue">重置已加载列表</button><button id="reset-history">重置导出去重记录</button></div>
<section aria-label="任务进度"><p id="progress" role="status" aria-live="polite">暂无任务</p><div class="row"><button id="pause" hidden>暂停</button><button id="stop" hidden>停止任务</button></div></section>
<p id="error" role="alert" hidden></p>
<p class="hint">设置与仓库连接请点击浏览器工具栏的插件图标。收起面板不会停止任务。批量导出保持原有线程采集规则，不用于逐条保存评论。</p>
<script src="page-tools.js"></script>
</body></html>
